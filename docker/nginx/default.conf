server {
    listen 80;
    server_name _;

    root /frontend/dist;
    index index.html;

    # Vue
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Symfony API
    location /sinje/ {
        root /app/public;
        try_files $uri /index.php$is_args$args;
    }

    location /l9/ {
        root /app/public;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        root /app/public;

        fastcgi_pass php:9000;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
    }

    location ~ \.php$ {
        return 404;
    }
}