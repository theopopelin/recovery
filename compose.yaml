services:

  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./conspiracy:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: ${DEFAULT_URI}
      DISCORD_TOKEN_API: ${DISCORD_TOKEN_API}
      
    depends_on:
      - postgres

  web:
    image: nginx:alpine
    volumes:
      - ./conspiracy:/app:ro
      - ./frontend:/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    ports:
      - "127.0.0.1:8000:80"

  node:
    image: node:24
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data: